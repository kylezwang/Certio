name: Build and deploy Python app to Azure Web App - notal-ai

on:
  push:
    branches:
      - production
    paths:
      - 'ai_agents/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          cd ai_agents
          python -m venv antenv
          source antenv/bin/activate

      - name: Install dependencies
        run: |
          cd ai_agents
          pip install -r requirements-minimal.txt

      - name: Zip artifact for deployment
        run: |
          cd ai_agents
          zip -r ../release.zip . -x "venv/*" -x "__pycache__/*" -x "*.pyc" -x ".env" -x "tests/*" -x "requirements.txt"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: 'Stop Azure Web App'
        run: |
          echo "Attempting to stop app to clear any locks..."
          # This will be manual or we can add Azure CLI if needed
          sleep 2
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'notal-ai'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_NOTAL_AI }}
          package: .
          restart: true
          clean: true
      
      - name: 'Verify Deployment'
        run: |
          echo "Waiting for app to restart..."
          sleep 15
          echo "Deployment complete. App should be running at https://notal-ai-dmaugkd6bvgqgpbb.centralus-01.azurewebsites.net"

