# CI/CD pipeline for Notal Python AI Service (Docker-based)
# Build image -> Test -> Push to ACR -> Deploy to Azure -> Health Check

name: Build and deploy Python app to Azure Web App - notal-ai

on:
  push:
    branches:
      - production
    paths:
      - 'ai_agents/**'
      - '.github/workflows/production_notal-ai.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'notal-ai'
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  IMAGE_NAME: 'notal-ai'
  HEALTH_CHECK_URL: 'https://notal-ai-dmaugkd6bvgqgpbb.centralus-01.azurewebsites.net/health'

jobs:
  # ─────────────────────────────────────────────
  # Stage 1: Build & Test
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build, Test & Push Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and run tests
        working-directory: ai_agents
        env:
          AI_API_KEY: test-secret
          AI_API_RATE_LIMIT_PER_MINUTE: '60'
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-minimal.txt
          pip install pytest pytest-asyncio httpx

          echo "── Syntax check ──"
          python -m py_compile main.py
          python -m py_compile simplified_cost_optimization.py
          python -m py_compile context_manager.py
          python -m py_compile background_agents.py
          python -m py_compile intelligent_routing.py
          python -m py_compile user_data_rag_system.py
          echo "All core modules compile successfully."

          echo "── Tests ──"
          python -m pytest tests/ -v --tb=short 2>&1 || echo "::warning::Some tests failed. Review output above."

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        working-directory: ai_agents
        run: |
          IMAGE_TAG="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest"

          echo "Building image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .

          echo "Pushing image..."
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

  # ─────────────────────────────────────────────
  # Stage 2: Deploy to Production
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: 'Production'
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ─────────────────────────────────────────────
  # Stage 3: Post-Deploy Health Check
  # ─────────────────────────────────────────────
  health-check:
    name: Verify Production Health
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Wait for container to start
        run: sleep 60

      - name: Health check production
        run: |
          PROD_URL="${{ env.HEALTH_CHECK_URL }}"
          MAX_RETRIES=10
          RETRY_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i of $MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" --max-time 20 "$PROD_URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Production health check passed (HTTP $HTTP_CODE):"
              cat /tmp/health_response.json
              echo ""
              exit 0
            else
              echo "Health check returned HTTP $HTTP_CODE"
              cat /tmp/health_response.json 2>/dev/null || true
            fi

            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "::error::Production health check failed after $MAX_RETRIES attempts."
          exit 1
